<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Tradi3 operator console</title>
  <desc id="desc">An animated console connecting a trading-system execution path to a smart-contract security trace.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.52" stop-color="#0a111b"/>
      <stop offset="1" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69f5d0"/>
      <stop offset="0.52" stop-color="#b8fce9"/>
      <stop offset="1" stop-color="#8da8ff"/>
    </linearGradient>
    <linearGradient id="signalGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de8c2" stop-opacity="0"/>
      <stop offset="0.46" stop-color="#4de8c2"/>
      <stop offset="0.58" stop-color="#8da8ff"/>
      <stop offset="1" stop-color="#ffb25e" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#6f88a8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="amberGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frameClip"><rect x="1" y="1" width="1198" height="438" rx="22"/></clipPath>
  </defs>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
    .micro { font-size: 11px; font-weight: 700; letter-spacing: 2.2px; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
    .body { font-size: 13px; letter-spacing: .15px; }
    .muted { fill: #71829a; }
    .cyan { fill: #69f5d0; }
    .amber { fill: #ffb25e; }
    .violet { fill: #8da8ff; }
    .white { fill: #eaf1fb; }
    .panel { fill: #0b131e; stroke: #26364a; stroke-width: 1; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: breathe 3.8s ease-in-out infinite alternate; }
    .bar:nth-of-type(2n) { animation-duration: 4.6s; animation-delay: -.9s; }
    .trace-1 { animation: lineOne 7s ease infinite; }
    .trace-2 { animation: lineTwo 7s ease infinite; }
    .trace-3 { animation: lineThree 7s ease infinite; }
    .trace-4 { animation: lineFour 7s ease infinite; }
    .status-dot { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .cursor { animation: cursor .9s steps(1) infinite; }
    .scan { animation: scan 7s linear infinite; }
    .step-build { animation: stepBuild 8s ease infinite; }
    .step-trace { animation: stepTrace 8s ease infinite; }
    .step-break { animation: stepBreak 8s ease infinite; }
    .step-prove { animation: stepProve 8s ease infinite; }
    .trip { animation: trip 7s ease infinite; }
    @keyframes breathe { from { transform: scaleX(.68); opacity: .52; } to { transform: scaleX(1); opacity: .95; } }
    @keyframes pulse { 0%,100% { opacity: .45; transform: scale(.72); } 50% { opacity: 1; transform: scale(1.25); } }
    @keyframes cursor { 0%,48% { opacity: 1; } 49%,100% { opacity: 0; } }
    @keyframes scan { from { transform: translateY(-32px); } to { transform: translateY(472px); } }
    @keyframes lineOne { 0%,6%,94%,100% { opacity:.2; } 12%,90% { opacity:1; } }
    @keyframes lineTwo { 0%,18%,94%,100% { opacity:.12; } 24%,90% { opacity:1; } }
    @keyframes lineThree { 0%,32%,94%,100% { opacity:.1; } 38%,90% { opacity:1; } }
    @keyframes lineFour { 0%,48%,94%,100% { opacity:.08; } 54%,90% { opacity:1; } }
    @keyframes trip { 0%,46%,94%,100% { opacity:.15; } 52%,86% { opacity:1; } 60%,70% { filter: url(#amberGlow); } }
    @keyframes stepBuild { 0%,18% { fill:#69f5d0; } 23%,100% { fill:#516075; } }
    @keyframes stepTrace { 0%,18% { fill:#516075; } 23%,40% { fill:#8da8ff; } 45%,100% { fill:#516075; } }
    @keyframes stepBreak { 0%,40% { fill:#516075; } 45%,62% { fill:#ffb25e; } 67%,100% { fill:#516075; } }
    @keyframes stepProve { 0%,62% { fill:#516075; } 67%,90% { fill:#eaf1fb; } 95%,100% { fill:#516075; } }
    @media (prefers-reduced-motion: reduce) {
      .bar, .trace-1, .trace-2, .trace-3, .trace-4, .status-dot, .cursor, .step-build, .step-trace, .step-break, .step-prove, .trip { animation: none; opacity: 1; }
      .scan { display: none; }
    }
  </style>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <rect class="scan" x="0" y="-32" width="1200" height="32" fill="#77ffe1" opacity=".025"/>
    <path d="M-40 410C210 305 335 500 600 385S985 310 1240 400" fill="none" stroke="#24455a" stroke-opacity=".22" stroke-width="80"/>
  </g>

  <rect x="1" y="1" width="1198" height="438" rx="22" fill="none" stroke="#2b3d52" stroke-width="2"/>

  <circle cx="28" cy="25" r="5" fill="#ff6b68"/>
  <circle cx="46" cy="25" r="5" fill="#ffbd5c"/>
  <circle cx="64" cy="25" r="5" fill="#55d98b"/>
  <text x="88" y="30" class="micro muted">TRADI3 // OPERATOR CONSOLE</text>
  <circle cx="1046" cy="25" r="4" class="status-dot" fill="#69f5d0" filter="url(#cyanGlow)"/>
  <text x="1060" y="30" class="micro cyan">ONLINE</text>
  <text x="1118" y="30" class="micro muted">00:09</text>
  <line x1="24" y1="48" x2="1176" y2="48" stroke="#26364a"/>

  <text x="48" y="119" font-size="72" font-weight="800" letter-spacing="7" fill="url(#titleGradient)">TRADI3</text>
  <rect x="49" y="136" width="52" height="3" rx="1.5" fill="#69f5d0" filter="url(#cyanGlow)"/>
  <text x="116" y="143" class="label white">TRADING SYSTEMS</text>
  <text x="278" y="143" class="label muted">//</text>
  <text x="309" y="143" class="label violet">SMART CONTRACT SECURITY</text>
  <text x="1125" y="116" font-size="26" class="cyan cursor">▌</text>

  <rect x="48" y="169" width="530" height="192" rx="12" class="panel"/>
  <rect x="622" y="169" width="530" height="192" rx="12" class="panel"/>

  <circle cx="71" cy="193" r="4" class="status-dot" fill="#69f5d0"/>
  <text x="84" y="198" class="micro cyan">MARKET ENGINE</text>
  <text x="445" y="198" class="micro muted">EXECUTION PATH</text>
  <line x1="68" y1="211" x2="558" y2="211" stroke="#243346"/>

  <text x="70" y="237" class="micro muted">BID</text>
  <text x="256" y="237" class="micro muted">ASK</text>
  <rect class="bar" x="70" y="251" width="143" height="8" rx="4" fill="#3fd7b4" opacity=".8"/>
  <rect class="bar" x="70" y="267" width="116" height="8" rx="4" fill="#3fd7b4" opacity=".64"/>
  <rect class="bar" x="70" y="283" width="87" height="8" rx="4" fill="#3fd7b4" opacity=".48"/>
  <rect class="bar" x="256" y="251" width="132" height="8" rx="4" fill="#ff9d57" opacity=".76"/>
  <rect class="bar" x="256" y="267" width="103" height="8" rx="4" fill="#ff9d57" opacity=".6"/>
  <rect class="bar" x="256" y="283" width="74" height="8" rx="4" fill="#ff9d57" opacity=".44"/>
  <text x="70" y="319" class="body white">quote</text>
  <text x="119" y="319" class="body muted">→</text>
  <text x="139" y="319" class="body white">execute</text>
  <text x="204" y="319" class="body muted">→</text>
  <text x="224" y="319" class="body white">settle</text>
  <path d="M326 327C362 319 375 285 407 291S445 338 480 310 520 249 553 259" fill="none" stroke="#69f5d0" stroke-width="2" opacity=".72"/>
  <circle cx="553" cy="259" r="4" fill="#69f5d0" filter="url(#cyanGlow)"/>
  <text x="70" y="345" class="micro muted">POLYTRADERBOT // SYSTEMS THAT MOVE VALUE</text>

  <circle cx="645" cy="193" r="4" class="status-dot" fill="#8da8ff"/>
  <text x="658" y="198" class="micro violet">SECURITY TRACE</text>
  <text x="1001" y="198" class="micro muted">SIMULATED</text>
  <line x1="642" y1="211" x2="1132" y2="211" stroke="#243346"/>

  <g class="trace-1">
    <text x="648" y="239" class="body muted">01</text>
    <text x="680" y="239" class="body white">CALL</text>
    <text x="728" y="239" class="body cyan">router.swap()</text>
  </g>
  <g class="trace-2">
    <text x="648" y="267" class="body muted">02</text>
    <text x="680" y="267" class="body white">STATE</text>
    <text x="736" y="267" class="body violet">Δ reserves</text>
    <text x="839" y="267" class="body muted">→ external callback</text>
  </g>
  <g class="trace-3">
    <text x="648" y="295" class="body muted">03</text>
    <text x="680" y="295" class="body white">CHECK</text>
    <text x="736" y="295" class="body amber">invariant(k)</text>
  </g>
  <g class="trace-4 trip">
    <rect x="674" y="311" width="280" height="28" rx="6" fill="#2a1815" stroke="#ff9d57" stroke-opacity=".7"/>
    <text x="687" y="330" class="micro amber">INVARIANT TRIPPED // TRACE IT</text>
  </g>
  <text x="976" y="330" class="micro muted">PoC</text>
  <path d="M1008 326h31l9-10 12 20 10-10h55" fill="none" stroke="#8da8ff" stroke-width="2" opacity=".78"/>

  <path id="signalPath" d="M552 259C590 259 604 236 642 236" fill="none" stroke="url(#signalGradient)" stroke-width="2" stroke-dasharray="5 6" opacity=".8"/>
  <circle r="4" fill="#eaf1fb" filter="url(#cyanGlow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M552 259C590 259 604 236 642 236"/>
  </circle>

  <line x1="48" y1="385" x2="1152" y2="385" stroke="#26364a"/>
  <text x="49" y="415" class="micro muted">MODE</text>
  <text x="112" y="415" class="label step-build">BUILD</text>
  <text x="174" y="415" class="label muted">→</text>
  <text x="205" y="415" class="label step-trace">TRACE</text>
  <text x="274" y="415" class="label muted">→</text>
  <text x="305" y="415" class="label step-break">BREAK</text>
  <text x="374" y="415" class="label muted">→</text>
  <text x="405" y="415" class="label step-prove">PROVE</text>
  <text x="870" y="415" class="micro muted">BUILDER</text>
  <text x="939" y="415" class="micro muted">//</text>
  <text x="967" y="415" class="micro white">SECURITY RESEARCHER</text>
</svg>
